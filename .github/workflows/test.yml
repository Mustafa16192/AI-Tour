name: tests

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report starter progress
        if: github.ref == 'refs/heads/main'
        run: npm run check-progress:report
      - name: Test starter infrastructure
        if: github.ref == 'refs/heads/main'
        run: npm run test:infrastructure
      - name: Verify completed lessons
        if: github.ref != 'refs/heads/main'
        run: npm run verify
